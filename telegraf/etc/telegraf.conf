[agent]
  ## Default data collection interval for all inputs
  interval = "60s"
  round_interval = true

[[inputs.cpu]]
  ## Whether to report per-cpu stats or not
  percpu = true
  ## Whether to report total system cpu stats or not
  totalcpu = true

[[inputs.mem]]
[[inputs.swap]]
[[inputs.disk]]
[[inputs.net]] 

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  skip_database_creation = true